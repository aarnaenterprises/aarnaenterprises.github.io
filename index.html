<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aarna Enterprises - Business Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Signature Pad Library -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbe1',
                            100: '#fff3b8',
                            500: '#eab308',
                            600: '#ca8a04',
                            700: '#a16207',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.5); border-radius: 4px; }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background-color: #0f172a;
            position: relative;
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 1100px;
                min-height: 94vh;
                margin: 3vh auto;
                border-radius: 24px;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.1);
            }
        }

        @media print {
            body * { visibility: hidden; }
            #printable-invoice, #printable-invoice * { visibility: visible; }
            #printable-invoice {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                color: black !important;
                padding: 24px;
            }
            .no-print { display: none !important; }
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 font-sans antialiased text-slate-100 min-h-full flex flex-col justify-center">

    <!-- App Container -->
    <div class="app-container">
        
        <!-- Native Style Header Toolbar -->
        <header class="bg-gradient-to-r from-amber-700 via-amber-600 to-emerald-700 px-4 py-3 shadow-lg flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-slate-900/50 flex items-center justify-center border border-amber-300/30 shadow-inner">
                    <i class="fa-solid fa-wheat-awn text-amber-300 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white leading-tight">Aarna Enterprises</h1>
                    <p class="text-[10px] text-amber-100/90 font-mono">GST: 23IRKPD1584H1ZQ | 📱 7988452368</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-200 border border-emerald-400/30 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Offline ERP
                </span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="app-content" class="flex-1 overflow-y-auto pb-20 p-3 sm:p-4 space-y-4">
            
            <!-- 1. DASHBOARD VIEW -->
            <div id="view-dashboard" class="tab-content active space-y-4">
                <!-- KPI Summary Grid -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3.5 shadow">
                        <p class="text-[11px] text-slate-400 font-medium">Total Purchase Value</p>
                        <h2 id="kpi-purchases" class="text-lg font-black text-amber-400 mt-1">₹0</h2>
                        <span class="text-[9px] text-slate-400">Stock Inflow Cost</span>
                    </div>
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3.5 shadow">
                        <p class="text-[11px] text-slate-400 font-medium">Total Sales Value</p>
                        <h2 id="kpi-sales" class="text-lg font-black text-emerald-400 mt-1">₹0</h2>
                        <span class="text-[9px] text-slate-400">Bills & Bookings</span>
                    </div>
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3.5 shadow">
                        <p class="text-[11px] text-slate-400 font-medium">Payment Received</p>
                        <h2 id="kpi-received" class="text-lg font-black text-blue-400 mt-1">₹0</h2>
                        <span class="text-[9px] text-slate-400">Cleared Cash / Online</span>
                    </div>
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3.5 shadow">
                        <p class="text-[11px] text-slate-400 font-medium">Pending to Receive</p>
                        <h2 id="kpi-pending" class="text-lg font-black text-rose-400 mt-1">₹0</h2>
                        <span class="text-[9px] text-slate-400">Outstanding Credit</span>
                    </div>
                </div>

                <!-- Quick Action Buttons -->
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="openBillModal('1st')" class="p-2.5 bg-amber-500/20 border border-amber-500/40 rounded-xl flex flex-col items-center hover:bg-amber-500/30">
                        <i class="fa-solid fa-file-signature text-amber-400 text-base mb-1"></i>
                        <span class="text-[10px] font-bold text-amber-200">1st Bill</span>
                    </button>
                    <button onclick="openBillModal('2nd')" class="p-2.5 bg-emerald-500/20 border border-emerald-500/40 rounded-xl flex flex-col items-center hover:bg-emerald-500/30">
                        <i class="fa-solid fa-receipt text-emerald-400 text-base mb-1"></i>
                        <span class="text-[10px] font-bold text-emerald-200">2nd GST Bill</span>
                    </button>
                    <button onclick="openPurchaseModal()" class="p-2.5 bg-blue-500/20 border border-blue-500/40 rounded-xl flex flex-col items-center hover:bg-blue-500/30">
                        <i class="fa-solid fa-truck-ramp-box text-blue-400 text-base mb-1"></i>
                        <span class="text-[10px] font-bold text-blue-200">+ Purchase</span>
                    </button>
                    <button onclick="openPaymentModal()" class="p-2.5 bg-purple-500/20 border border-purple-500/40 rounded-xl flex flex-col items-center hover:bg-purple-500/30">
                        <i class="fa-solid fa-hand-holding-dollar text-purple-400 text-base mb-1"></i>
                        <span class="text-[10px] font-bold text-purple-200">+ Payment</span>
                    </button>
                </div>

                <!-- Inventory Stock Matrix -->
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 shadow">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-boxes-stacked"></i> Inventory Matrix
                        </h3>
                    </div>
                    <!-- [Your missing inventory item markup goes here] -->
                </div>
            </div>
        </main>
    </div>

    <!-- Core App Scripts -->
    <script>
        // Placeholder function declarations to prevent "uncaught ReferenceError" on click
        function openBillModal(type) {
            console.log("Opening Bill Modal for type:", type);
            // Add your logic here
        }

        function openPurchaseModal() {
            console.log("Opening Purchase Modal");
            // Add your logic here
        }

        function openPaymentModal() {
            console.log("Opening Payment Modal");
            // Add your logic here
        }
    </script>
</body>
</html>
